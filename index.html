<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#101010" name="theme-color"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
  <script defer="" src="script.js">
  </script>
  <title>
   Juan Bertaud &mdash; Sports Graphic Designer
  </title>
 </head>
 <body class="portfolio-page">
  <header class="floating-header">
   <nav aria-label="Main navigation" class="nav-bubble">
    <a class="nav-portfolio" href="#featured-work">
     Portfolio
    </a>
    <a class="nav-about" href="about.html">
     Resume
    </a>
   </nav>
  </header>
  <main>
   <section aria-label="Introduction" class="intro-section">
    <p class="intro-kicker">
     SPORTS GRAPHIC DESIGNER
    </p>
    <h1>
     Juan Bertaud
    </h1>
    <p class="intro-copy">
     DESIGNING FOR THE TEAMS, ATHLETES, AND MOMENTS THAT DEFINE SPORTS
    </p>
   </section>
   <section aria-label="Featured sports design artwork" class="feature-section" id="featured-work">
    <div class="feature-viewport">
     <div class="feature-track">
      <div aria-hidden="false" class="feature-slide is-active" data-slide="0">
       <img alt="Featured sports artwork 1" fetchpriority="high" src="assets/art/hammer-week-v6.png"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="1">
       <img alt="Featured sports artwork 2" loading="lazy" src="assets/art/kyrie-irving.png"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="2">
       <img alt="Featured sports artwork 3" loading="lazy" src="assets/art/augsburg-gameday-v6.jpg"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="3">
       <img alt="Featured sports artwork 4" loading="lazy" src="assets/art/ceedee-v6.png"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="4">
       <img alt="Featured sports artwork 5" loading="lazy" src="assets/art/gustavus-gameweek-2025.jpg"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="5">
       <img alt="Featured sports artwork 6" loading="lazy" src="assets/art/shohei-ohtani.jpg"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="6">
       <img alt="Featured sports artwork 7" loading="lazy" src="assets/art/jamarr-v6.png"/>
      </div>
      <div aria-hidden="true" class="feature-slide" data-slide="7">
       <img alt="Featured sports artwork 8" loading="lazy" src="assets/art/hamilton-1-copy.jpg"/>
      </div>
     </div>
     <button aria-label="Previous featured artwork" class="hero-arrow hero-prev" id="prev">
      &lsaquo;
     </button>
     <button aria-label="Next featured artwork" class="hero-arrow hero-next" id="next">
      &rsaquo;
     </button>
     <div aria-label="Choose featured artwork" class="feature-dots">
      <button aria-current="true" aria-label="Show featured artwork 1" class="feature-dot active" data-dot="0">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 2" class="feature-dot" data-dot="1">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 3" class="feature-dot" data-dot="2">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 4" class="feature-dot" data-dot="3">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 5" class="feature-dot" data-dot="4">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 6" class="feature-dot" data-dot="5">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 7" class="feature-dot" data-dot="6">
      </button>
      <button aria-current="false" aria-label="Show featured artwork 8" class="feature-dot" data-dot="7">
      </button>
     </div>
    </div>
    <div class="featured-shelf">
     <div class="shelf-title">
      <h1>
       Featured Work
      </h1>
      <span id="slide-number">
       01
      </span>
     </div>
     <div class="featured-thumbnails">
      <button aria-label="View featured artwork 1" class="featured-thumb selected" data-feature="0">
       <img alt="" loading="lazy" src="assets/art/hammer-week-v6.png"/>
      </button>
      <button aria-label="View featured artwork 2" class="featured-thumb" data-feature="1">
       <img alt="" loading="lazy" src="assets/art/kyrie-irving.png"/>
      </button>
      <button aria-label="View featured artwork 3" class="featured-thumb" data-feature="2">
       <img alt="" loading="lazy" src="assets/art/augsburg-gameday-v6.jpg"/>
      </button>
      <button aria-label="View featured artwork 4" class="featured-thumb" data-feature="3">
       <img alt="" loading="lazy" src="assets/art/ceedee-v6.png"/>
      </button>
      <button aria-label="View featured artwork 5" class="featured-thumb" data-feature="4">
       <img alt="" loading="lazy" src="assets/art/gustavus-gameweek-2025.jpg"/>
      </button>
      <button aria-label="View featured artwork 6" class="featured-thumb" data-feature="5">
       <img alt="" loading="lazy" src="assets/art/shohei-ohtani.jpg"/>
      </button>
      <button aria-label="View featured artwork 7" class="featured-thumb" data-feature="6">
       <img alt="" loading="lazy" src="assets/art/jamarr-v6.png"/>
      </button>
      <button aria-label="View featured artwork 8" class="featured-thumb" data-feature="7">
       <img alt="" loading="lazy" src="assets/art/hamilton-1-copy.jpg"/>
      </button>
     </div>
    </div>
   </section>
   <section class="collections" id="collections">
    <div class="section-line">
     <h2>
      Official Work
     </h2>
     <span class="section-detail">
      Hamline Football &middot; Graphic design internship
     </span>
    </div>
    <div class="cards-grid">
     <button aria-label="View Hamline Football 2026" class="project-card" data-open="client-2026">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/hammer-week-v6.png"/>
      </span>
      <span class="project-info">
       <span>
        Hamline Football
        <small>
         2026
        </small>
       </span>
      </span>
     </button>
     <button aria-label="View Hamline Football 2025" class="project-card" data-open="client-2025">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/gustavus-gameweek-2025.jpg"/>
      </span>
      <span class="project-info">
       <span>
        Hamline Football
        <small>
         2025
        </small>
       </span>
      </span>
     </button>
    </div>
    <div class="section-line section-spaced">
     <h2>
      Personal Projects
     </h2>
     <span class="section-detail">
      Independent sports design
     </span>
    </div>
    <div class="cards-grid">
     <button aria-label="View Basketball Personal projects" class="project-card" data-open="sport-basketball">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/kyrie-irving.png"/>
      </span>
      <span class="project-info">
       <span>
        Basketball
       </span>
      </span>
     </button>
     <button aria-label="View Football Personal projects" class="project-card" data-open="sport-football">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/ceedee-v6.png"/>
      </span>
      <span class="project-info">
       <span>
        Football
       </span>
      </span>
     </button>
     <button aria-label="View Baseball Personal projects" class="project-card" data-open="sport-baseball">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/shohei-ohtani.jpg"/>
      </span>
      <span class="project-info">
       <span>
        Baseball
       </span>
      </span>
     </button>
     <button aria-label="View Motorsport Personal projects" class="project-card" data-open="sport-motorsport">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/hamilton-1-copy.jpg"/>
      </span>
      <span class="project-info">
       <span>
        Motorsport
       </span>
      </span>
     </button>
     <button aria-label="View Soccer Personal projects" class="project-card" data-open="sport-soccer">
      <span class="project-image">
       <img alt="" loading="lazy" src="assets/art/wc-final.jpg"/>
      </span>
      <span class="project-info">
       <span>
        Soccer
       </span>
      </span>
     </button>
    </div>
   </section>
   <section class="collection-view" hidden="" id="collection-view">
    <button class="back-button" id="back-to-collections">
     All Projects
    </button>
    <div class="collection-heading">
     <h2 id="collection-title">
     </h2>
     <p id="collection-subtitle">
     </p>
    </div>
    <div class="art-grid" id="art-grid">
    </div>
   </section>
  </main>
  <div aria-label="Artwork viewer" aria-modal="true" class="lightbox" hidden="" id="lightbox" role="dialog">
   <button aria-label="Close artwork" class="lightbox-close" id="lightbox-close">
    &times;
   </button>
   <button aria-label="Previous artwork" class="lightbox-prev" id="lightbox-prev">
    <span class="sr-only">
     Previous artwork
    </span>
   </button>
   <img alt="Full artwork" id="lightbox-image"/>
   <button aria-label="Next artwork" class="lightbox-next" id="lightbox-next">
    <span class="sr-only">
     Next artwork
    </span>
   </button>
  </div>
  <footer class="footer">
   <span>
    &copy; 2026 Juan Bertaud
   </span>
   <div>
    <a href="https://www.instagram.com/jb.designs___/" rel="noopener" target="_blank">
     Instagram
    </a>
    <a href="about.html">
     Contact
    </a>
   </div>
  </footer>
  <div aria-hidden="true" class="custom-cursor">
   <span>
    VIEW
   </span>
  </div>
 </body>
</html>
